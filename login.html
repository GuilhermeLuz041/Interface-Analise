<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cimas Turbo</title>
    <link rel="stylesheet" href="CSS/Style.css">
    <link rel="icon" href="img/Icon.png" type="image/x-icon">
</head>
<body>
    <header>
        <img src="img/logo.png" alt="logo">
    </header>

    <div class="container" id="container">
        <h2>Login Cliente</h2>
        <form>
 
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
            
            <label for="nome">Senha</label>
            <input type="text" id="nome" name="nome" required>

            <div class="services">
                <div class="service"><a href="loginCliente.html">Login</a></div>
            </div>
        </form>
    </div>

    <div class="container" id="container">
        <h2>Login Mecânico/Gerente</h2>
        <form>
 
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
            
            <label for="nome">Senha</label>
            <input type="text" id="nome" name="nome" required>

            <div class="services">
                <div class="service"><a href="loginFuncionario.html">Login</a></div>
            </div>
        </form>
    </div>

    <footer id="footer">
        © 2025 Cimas Turbo - Todos os direitos reservados.
    </footer>
</body>
</html>
