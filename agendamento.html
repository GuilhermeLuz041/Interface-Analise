<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="CSS/Style.css">
    <link rel="icon" href="img/Icon.png" type="image/x-icon">
    <title>Cimas Turbo</title>
</head>
<body>

    <header>
        <img src="img/logo.png" alt="logo">
    </header>

<div id="conteudo">
    <div class="container" id="container">
        <h2>Agende seu serviço</h2>
        <form>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" required>

            <label for="data">Data do Serviço</label>
            <input type="date" id="data" name="data" required>

            <label for="servico">Serviço</label>
            <select id="servico" name="servico" required>
                <option value="troca-oleo">Troca de Óleo</option>
                <option value="revisao">Revisão Geral</option>
                <option value="freios">Troca de Freios</option>
                <option value="suspensao">Suspensão</option>
            </select>

            <label for="mensagem">Observações</label>
            <textarea id="mensagem" name="mensagem" rows="4"></textarea>

            <button type="submit">Agendar</button>
        </form>
    </div>
</div>
<footer id="footer">
        © 2025 Cimas Turbo - Todos os direitos reservados.
    </footer>
</body>
</html>
