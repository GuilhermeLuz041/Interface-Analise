<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Estoque - Cimas Turbo</title>
    <link rel="stylesheet" href="CSS/Style.css">
    <link rel="icon" href="img/Icon.png" type="image/x-icon">
</head>
<body>
    <header>
        <img src="img/logo.png" alt="logo">
        <a href="loginFuncionario.html" class="btn-voltar">Voltar</a>
    </header>

    <div class="container">
        <h2>Estoque de Peças</h2>
        <div class="estoque-actions">
            <form class="form-estoque">
                <input type="text" placeholder="Nome do item" required>
                <input type="number" placeholder="Quantidade" required>
                <button type="submit">Adicionar</button>
            </form>
        </div>

        <div class="lista-estoque">
            <div class="item-estoque">
                <span>Óleo Motor 5W30</span>
                <span>Quantidade: 12</span>
            </div>
            <div class="item-estoque">
                <span>Pastilhas de Freio</span>
                <span>Quantidade: 8</span>
            </div>
        </div>
    </div>

    <footer id="footer">
        © 2025 Cimas Turbo - Todos os direitos reservados.
    </footer>
</body>
</html>
