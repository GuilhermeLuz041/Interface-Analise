<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Diário - Cimas Turbo</title>
    <link rel="stylesheet" href="CSS/Style.css">
    <link rel="icon" href="img/Icon.png" type="image/x-icon">
</head>
<body>
    <header>
        <img src="img/logo.png" alt="logo">
        <a href="loginFuncionario.html" class="btn-voltar">Voltar</a>
    </header>

    <div class="container">
        <h2>Gerar Relatório Diário</h2>
        <form class="form-relatorio">
            <label for="data-relatorio">Selecione a Data:</label>
            <input type="date" id="data-relatorio" required>
            <button type="submit">Gerar Relatório</button>
        </form>
        
        <div class="relatorio-box">
            <h3>Relatório - 25/10/2025</h3>
            <p>Serviços realizados: 8</p>
            <p>Faturamento: R$ 2.450,00</p>
            <p>Clientes atendidos: 5</p>
        </div>
    </div>

    <footer id="footer">
        © 2025 Cimas Turbo - Todos os direitos reservados.
    </footer>
</body>
</html>
